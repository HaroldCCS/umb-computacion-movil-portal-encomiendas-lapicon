# Calidad de la PWA (aplicacion_pwa/, docs/10): tipos, lint, pruebas, build y E2E en celular.
#
# No despliega: el despliegue a Cloudflare Pages lo hace Cloudflare al conectar el repositorio
# (raíz aplicacion_pwa, build "npm run build", salida "dist"), o se agrega aquí con un token
# de Cloudflare como secreto. No toca el workflow de Flutter (compilar-apps.yml).

name: PWA

on:
  push:
    branches: [main]
    paths:
      - 'aplicacion_pwa/**'
      - '.github/workflows/pwa.yml'
  pull_request:
    paths:
      - 'aplicacion_pwa/**'
      - '.github/workflows/pwa.yml'
  workflow_dispatch:

concurrency:
  group: pwa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: aplicacion_pwa

jobs:
  calidad:
    name: Tipos, lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aplicacion_pwa/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: lapticon-pwa-dist
          path: aplicacion_pwa/dist
          retention-days: 7

  e2e:
    name: E2E en celular (iPhone y Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aplicacion_pwa/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: aplicacion_pwa/test-results
          retention-days: 7
