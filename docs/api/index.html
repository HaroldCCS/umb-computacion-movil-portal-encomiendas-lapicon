  <div class="aviso">
    Contrato verificado contra el servidor el 22-oct-2026. ✅ funciona · ⚠️ falla o se comporta distinto ·

  <script>
    window.ui = SwaggerUIBundle({
      spec: {"openapi": "3.1.0", "info": {"title": "Lapticon API", "version": "2026-10-28", "description": "Contrato del backend compartido del curso (Node/Express + MongoDB en Render), reconstruido a partir de la colección\nde Postman y del **Swagger oficial del profesor** (`/api-docs`, copia en `referencias/swagger-oficial.json`), y\n**verificado con peticiones reales** el 22-oct y el 28-oct-2026 con dos cuentas propias (remitente y viajero). Las\nrespuestas de ejemplo son reales (teléfono y correo ocultos) y están en `referencias/respuestas/`.\n\n**Servidor:** el oficial declara `lapticon-backend-ed.onrender.com`, que no existe (404 en todo). Todas sus rutas\nresponden en `lapticon-backend.onrender.com`, que es el que se usa aquí.\n\n**Cómo leer este documento**\n\n| Marca | Significado |\n|---|---|\n| ✅ | Existe y responde como se documenta |\n| ⚠️ | Existe, pero falla en el servidor o se comporta distinto a lo esperado |\n| 🆕 | **No existe**: la app lo necesita y hoy lo resuelve en el dispositivo. Es una propuesta para el backend |\n\n**Autenticación:** iniciar sesión con Firebase Auth (proyecto `lapticon-eba31`) y enviar el `idToken` en\n`Authorization: Bearer <idToken>`. Son públicas solo `GET /api/ratings/{uid}`, `/api/ciudades/*`,\n`GET /api/viajes/disponibles`, `GET /api/vuelos/…` y `POST /api/encomiendas/actualizar-vencidas`.\nEl backend toma el usuario del token (`req.user.uid`): **nunca** se manda el uid propio en el body.\n\n**Roles:** el backend **no tiene roles**: no guarda `rol`. Sí comprueba que quien cambia una encomienda sea su\nremitente o su viajero asignado (403), y que quien cambia un viaje sea su dueño (404), pero no qué cambio hace cada\nuno. El rol lo decide la app. Cada operación dice en el título quién la usa (📦 Remitente · ✈️ Viajero · 🌐 Público) y lo repite en\n`x-roles`.\n\n| Rol | Qué hace | Endpoints |\n|---|---|---|\n| 📦 Remitente | Publica encomiendas, busca viajeros, retira, confirma que la recibió y califica | `POST /api/encomiendas`, `GET /api/encomiendas`, `GET /api/encomiendas/mis-encomiendas`, `GET /api/viajes/buscar`, `GET /api/viajes/disponibles`, `POST /api/encomiendas/emparejar-viajes`, `PUT …/estado` (`vencida`, `recibida`), `POST /api/ratings` |\n| ✈️ Viajero | Registra su viaje, explora y toma encomiendas, la entrega y califica | `POST /api/viajes`, `GET /api/viajes`, `GET /api/viajes/disponible`, `PATCH /api/viajes/{id}/estado`, `GET /api/vuelos/…`, `GET /api/encomiendas/buscar`, `GET /api/encomiendas/disponibles`, `GET /api/encomiendas/disponibles2`, `PUT …/tomar/{id}`, `PUT …/estado` (`entregada`), `POST /api/ratings` |\n| Los dos | Perfil, chat, asistente | `/api/users/*`, `GET /api/chats/estado/{chatId}`, `POST /api/chatbot` |\n| 🌐 Público | Sin token | `GET /api/ratings/{uid}`, `/api/ciudades/*`, `GET /api/viajes/disponibles`, `GET /api/vuelos/…` |\n\n**Errores:** siempre `{ \"error\": \"…\" }` (a veces con `detalle`). Los éxitos usan `message` en usuarios y `mensaje`\nen el resto.\n\n**Arranque en frío:** Render gratuito duerme el servidor; la primera petición puede tardar hasta ~60 s.\n", "contact": {"name": "Harold Camargo — Computación Móvil, UMB"}}, "servers": [{"url": "https://lapticon-backend.onrender.com", "description": "Backend del curso (producción)"}], "tags": [{"name": "Autenticación", "description": "Firebase Auth. En la app no se llama a este endpoint; se usa el SDK de Firebase."}, {"name": "Usuarios", "description": "Perfil del usuario autenticado."}, {"name": "Viajes", "description": "El viajero registra su vuelo; solo puede tener un viaje `disponible` a la vez y puede cancelarlo o cerrarlo."}, {"name": "Encomiendas", "description": "El remitente publica; el viajero toma, entrega y el remitente confirma."}, {"name": "Calificaciones", "description": "Remitente y viajero se califican de 1 a 5."}, {"name": "Chats", "description": "Los mensajes van directo a Firestore; el backend abre el chat del par al tomar y lo cierra al entregar."}, {"name": "Ciudades", "description": "Listas públicas para autocompletar. Enviar los nombres exactamente como vienen (`Bogota`, sin tilde)."}, {"name": "Chatbot", "description": "Asistente con IA (OpenRouter) a través del backend."}, {"name": "🆕 Faltan en el backend", "description": "Endpoints que la app necesita y el backend no tiene. Hoy la app los suple guardando datos **por dispositivo**\n(`SharedPreferences` / `localStorage`) o cruzando listas, así que se pierden al cambiar de celular.\nEs una propuesta: cuerpos y respuestas siguen el estilo del backend actual. Desde el Swagger oficial (28-oct)\nya existen cerrar viaje (`PATCH /api/viajes/{id}/estado`) y las encomiendas tomadas (`GET /api/encomiendas/buscar`).\n"}], "security": [{"bearerAuth": []}], "paths": {"/v1/accounts:signInWithPassword": {"servers": [{"url": "https://identitytoolkit.googleapis.com", "description": "Firebase Auth (Google Identity Toolkit)"}], "post": {"tags": ["Autenticación"], "summary": "✅ Obtener el idToken (solo para pruebas en Postman/Swagger) — 🔓 Sin sesión", "description": "**Quién la usa:** 🔓 Sin sesión. Cualquiera, antes de entrar.\n\nDevuelve el `idToken` que se pega en **Authorize** (arriba a la derecha). Dura 1 hora.\nLa `key` es la API key web de Firebase (está en el environment de Postman). En la app se usa\n`signInWithEmailAndPassword()` y `getIdToken()` del SDK.\n", "x-roles": ["publico"], "operationId": "obtenerIdToken", "security": [], "parameters": [{"name": "key", "in": "query", "required": true, "schema": {"type": "string"}, "description": "API key web de Firebase del proyecto `lapticon-eba31`."}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["email", "password", "returnSecureToken"], "properties": {"email": {"type": "string", "format": "email"}, "password": {"type": "string", "format": "password"}, "returnSecureToken": {"type": "boolean", "const": true}}}, "example": {"email": "tu-correo@ejemplo.com", "password": "********", "returnSecureToken": true}}}}, "responses": {"200": {"description": "Sesión iniciada.", "content": {"application/json": {"schema": {"type": "object", "properties": {"idToken": {"type": "string", "description": "JWT para `Authorization: Bearer`"}, "localId": {"type": "string", "description": "uid de Firebase"}, "email": {"type": "string"}, "refreshToken": {"type": "string"}, "expiresIn": {"type": "string", "example": "3600"}}}}}}, "400": {"description": "Credenciales inválidas (`INVALID_LOGIN_CREDENTIALS`)."}}}}, "/api/users/register": {"post": {"tags": ["Usuarios"], "summary": "✅ Registrar o actualizar mi perfil — 📦 Remitente · ✈️ Viajero", "description": "**Quién la usa:** 📦 Remitente · ✈️ Viajero. Los dos, al crear su perfil (antes de elegir rol).\n\nCrea el perfil del usuario del token o lo actualiza si ya existe. El `email` lo toma del token.\n", "x-roles": ["remitente", "viajero"], "operationId": "registrarUsuario", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UsuarioEntrada"}, "example": {"nombre": "Harold", "apellido": "Camargo", "telefono": "3001234567", "nacionalidad": "Colombia"}}}}, "responses": {"201": {"description": "Perfil guardado.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RespuestaUsuario"}, "example": {"message": "Usuario guardado correctamente", "user": {"_id": "6ada5bbe55174b0d3b920bae", "uid": "Cpmc8Mv0CkTD0aJJMtiOBEzDNV03", "nombre": "Harold", "apellido": "Camargo", "telefono": "<oculto>", "nacionalidad": "Colombia", "email": "<oculto>", "createdAt": "2026-10-22T18:53:50.787Z", "updatedAt": "2026-10-22T18:54:11.711Z", "__v": 0}}}}}, "401": {"$ref": "#/components/responses/NoAutenticado"}}}}, "/api/users/{uid}": {"parameters": [{"$ref": "#/components/parameters/Uid"}], "get": {"tags": ["Usuarios"], "summary": "✅ Ver mi perfil — 📦 Remitente · ✈️ Viajero", "description": "**Quién la usa:** 📦 Remitente · ✈️ Viajero. Los dos, su propio perfil.\n\nSolo funciona con el uid propio. Cualquier otro uid (exista o no) responde **403**.\n", "x-roles": ["remitente", "viajero"], "operationId": "obtenerUsuario", "responses": {"200": {"description": "Mi perfil.", "content": {"application/json": {"schema": {"type": "object", "properties": {"user": {"$ref": "#/components/schemas/Usuario"}}}, "examples": {"propio": {"summary": "Perfil propio", "value": {"user": {"_id": "6ada5bbe55174b0d3b920bae", "uid": "Cpmc8Mv0CkTD0aJJMtiOBEzDNV03", "nombre": "Harold", "apellido": "Camargo", "telefono": "<oculto>", "nacionalidad": "Colombia", "email": "<oculto>", "createdAt": "2026-10-22T18:53:50.787Z", "updatedAt": "2026-10-22T18:54:11.711Z", "__v": 0}}}}}}}, "401": {"$ref": "#/components/responses/NoAutenticado"}, "403": {"description": "El uid no es el mío.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "No autorizado para consultar este usuario"}}}}}}, "put": {"tags": ["Usuarios"], "summary": "⚠️ Actualizar mi perfil (no guarda `rol`) — 📦 Remitente · ✈️ Viajero", "description": "**Quién la usa:** 📦 Remitente · ✈️ Viajero. Los dos, su propio perfil.\n\nAcepta campos parciales. **No guarda `rol`**: responde 200 pero lo descarta, por eso el rol vive en el\ndispositivo. Ver la propuesta `PUT /api/users/{uid}/rol`.\n", "x-roles": ["remitente", "viajero"], "operationId": "actualizarUsuario", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UsuarioParcial"}, "example": {"nombre": "Harold", "telefono": "3001234567"}}}}, "responses": {"200": {"description": "Perfil actualizado.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RespuestaUsuario"}, "example": {"message": "Usuario actualizado correctamente", "user": {"_id": "6ada5bbe55174b0d3b920bae", "uid": "Cpmc8Mv0CkTD0aJJMtiOBEzDNV03", "nombre": "Harold", "apellido": "Camargo", "telefono": "<oculto>", "nacionalidad": "Colombia", "email": "<oculto>", "createdAt": "2026-10-22T18:53:50.787Z", "updatedAt": "2026-10-22T18:54:11.711Z", "__v": 0}}}}}, "401": {"$ref": "#/components/responses/NoAutenticado"}, "400": {"description": "Se intentó cambiar `uid` o `email` (según el oficial; las apps no los mandan).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "403": {"description": "El uid no es el mío.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "No autorizado para modificar este usuario"}}}}}}}, "/api/viajes": {"post": {"tags": ["Viajes"], "summary": "✅ Registrar mi viaje — ✈️ Viajero", "description": "**Quién la usa:** ✈️ Viajero. El viajero registra el vuelo en el que ya va.\n\nEl viajero registra su vuelo. Solo se permite **un viaje `disponible`** a la vez.\n`fechaViaje` se guarda como medianoche UTC: leerla como fecha de calendario, no como instante (en Colombia se\nvería un día antes).\n", "x-roles": ["viajero"], "operationId": "crearViaje", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ViajeEntrada"}, "example": {"numeroVuelo": "AV10", "ciudadOrigen": "Bogota", "ciudadDestino": "Miami", "fechaViaje": "2026-12-01"}}}}, "responses": {"201": {"description": "Viaje creado.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Viaje"}, "example": {"_id": "6ad95bc8f8b6da54469cfc4f", "uid": "mdXW0aoFp3dCis7gGvLBzTpHFBy1", "numeroVuelo": "AA123", "ciudadOrigen": "Bogota", "ciudadDestino": "Miami", "fechaViaje": "2026-12-01T00:00:00.000Z", "estado": "disponible", "createdAt": "2026-10-22T00:41:44.670Z", "__v": 0}}}}, "400": {"description": "Ya tengo un viaje disponible.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "Ya tienes un viaje disponible. Debes cerrarlo o cambiar su estado antes de registrar uno nuevo."}}}}, "401": {"$ref": "#/components/responses/NoAutenticado"}}}, "get": {"tags": ["Viajes"], "summary": "✅ Listar mis viajes — ✈️ Viajero", "description": "**Quién la usa:** ✈️ Viajero. El viajero ve su historial de viajes.\n", "x-roles": ["viajero"], "operationId": "listarMisViajes", "responses": {"200": {"description": "Mis viajes (vacío `[]` si no hay).", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Viaje"}}, "example": []}}}, "401": {"$ref": "#/components/responses/NoAutenticado"}}}}, "/api/viajes/disponible": {"get": {"tags": ["Viajes"], "summary": "✅ Mi viaje disponible — ✈️ Viajero", "description": "**Quién la usa:** ✈️ Viajero. El viajero: define la ruta de Explorar.\n", "x-roles": ["viajero"], "operationId": "miViajeDisponible", "responses": {"200": {"description": "El viaje activo (objeto directo, sin envoltorio).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Viaje"}, "example": {"_id": "6ad95bc8f8b6da54469cfc4f", "uid": "mdXW0aoFp3dCis7gGvLBzTpHFBy1", "numeroVuelo": "AA123", "ciudadOrigen": "Bogota", "ciudadDestino": "Miami", "fechaViaje": "2026-12-01T00:00:00.000Z", "estado": "disponible", "createdAt": "2026-10-22T00:41:44.670Z", "__v": 0}}}}, "401": {"$ref": "#/components/responses/NoAutenticado"}, "404": {"description": "No tengo viaje activo. Ojo, usa `mensaje`, no `error`.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Mensaje"}, "example": {"mensaje": "No hay viajes disponibles"}}}}}}}, "/api/viajes/buscar": {"get": {"tags": ["Viajes"], "summary": "✅ Buscar viajeros por ciudad de origen — 📦 Remitente", "description": "**Quién la usa:** 📦 Remitente. El remitente busca quién viaja desde su ciudad.\n", "x-roles": ["remitente"], "operationId": "buscarViajes", "parameters": [{"name": "ciudad", "in": "query", "required": true, "description": "Ciudad de **origen**, tal como la devuelve `/api/ciudades/ciudades`.", "schema": {"type": "string", "example": "Bogota"}}], "responses": {"200": {"description": "Viajes desde esa ciudad (incluye el `uid` del viajero).", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Viaje"}}, "example": [{"_id": "6ad95bc8f8b6da54469cfc4f", "uid": "mdXW0aoFp3dCis7gGvLBzTpHFBy1", "numeroVuelo": "AA123", "ciudadOrigen": "Bogota", "ciudadDestino": "Miami", "fechaViaje": "2026-12-01T00:00:00.000Z", "estado": "disponible", "createdAt": "2026-10-22T00:41:44.670Z", "__v": 0}]}}}, "401": {"$ref": "#/components/responses/NoAutenticado"}}}}, "/api/viajes/disponibles": {"get": {"tags": ["Viajes"], "summary": "✅ Viajeros con viaje disponible en una ruta (con nombre) — 🌐 Público", "description": "**Quién la usa:** 📦 Remitente (sin token). El remitente busca quién viaja por su ruta completa y ve su nombre.\n\nPública. A diferencia de `/api/viajes/buscar`, filtra por origen **y** destino y trae `nombreUsuario`. Solo\naparecen viajes `disponible`: cuando el viaje se cierra, el nombre ya no se puede consultar.\n", "x-roles": ["publico", "remitente"], "operationId": "viajerosDisponiblesEnRuta", "security": [], "parameters": [{"name": "ciudadOrigen", "in": "query", "required": true, "schema": {"type": "string", "example": "Bogota"}}, {"name": "ciudadDestino", "in": "query", "required": true, "schema": {"type": "string", "example": "Miami"}}], "responses": {"200": {"description": "Viajeros de la ruta.", "content": {"application/json": {"schema": {"type": "array", "items": {"type": "object", "properties": {"ciudadOrigen": {"type": "string"}, "ciudadDestino": {"type": "string"}, "fechaViaje": {"type": "string", "format": "date-time"}, "nombreUsuario": {"type": "string"}, "uid": {"type": "string", "description": "uid del viajero"}}}}, "example": [{"ciudadOrigen": "Bogota", "ciudadDestino": "Miami", "fechaViaje": "2026-12-01T00:00:00.000Z", "nombreUsuario": "Harold Viajero", "uid": "IeMGfjHQ7XTc0W08QrTzx1flvo13"}]}}}}}}, "/api/viajes/{id}/estado": {"parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "example": "6ae29800411da1034525b3de"}}], "patch": {"tags": ["Viajes"], "summary": "✅ Cancelar o cerrar mi viaje — ✈️ Viajero", "description": "**Quién la usa:** ✈️ Viajero. Solo el dueño del viaje.\n\nEs **`PATCH`** (no PUT). Después de `cancelado` o `completado`, `GET /api/viajes/disponible` da 404 y se puede\nregistrar otro viaje. El oficial lista también `contactado`, pero aquí da 400.\n\n⚠️ El servidor deja volver un viaje cancelado a `disponible` (la app no lo ofrece) y no revisa si tiene\nencomiendas tomadas sin entregar: la app avisa antes de cancelar.\n", "x-roles": ["viajero"], "operationId": "cambiarEstadoViaje", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["estado"], "properties": {"estado": {"type": "string", "enum": ["disponible", "completado", "cancelado"]}}}, "examples": {"cancelar": {"summary": "El viajero cancela", "value": {"estado": "cancelado"}}, "cerrar": {"summary": "El viajero lo cierra", "value": {"estado": "completado"}}}}}}, "responses": {"200": {"description": "Estado actualizado. Ojo, usa `message`, no `mensaje`.", "content": {"application/json": {"schema": {"type": "object", "properties": {"message": {"type": "string"}, "viaje": {"$ref": "#/components/schemas/Viaje"}}}, "example": {"message": "Estado actualizado", "viaje": {"_id": "6ae29800411da1034525b3de", "uid": "Cpmc8Mv0CkTD0aJJMtiOBEzDNV03", "numeroVuelo": "LA2401", "ciudadOrigen": "Cali", "ciudadDestino": "Lima", "fechaViaje": "2026-12-10T00:00:00.000Z", "estado": "completado", "createdAt": "2026-10-29T00:49:04.238Z", "__v": 0}}}}}, "400": {"description": "Estado inválido (también `contactado`).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "Estado inválido"}}}}, "401": {"$ref": "#/components/responses/NoAutenticado"}, "404": {"description": "No existe o no es mío.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "Viaje no encontrado o no autorizado"}}}}}}}, "/api/vuelos/{numero}/{fecha}": {"get": {"tags": ["Viajes"], "summary": "⚠️ Verificar un vuelo (AeroDataBox) — hoy da 500 — 🌐 Público", "description": "**Quién la usa:** nadie en la interfaz (docs/11 §2H). Queda en el repositorio de las apps por si vuelve a funcionar.\n\nPública (no pide token). Existe, pero el servidor no tiene configurada `RAPIDAPI_KEY`, así que las apps **no\nmuestran** la verificación. La forma de la respuesta exitosa **no se ha podido confirmar**.\n", "x-roles": ["publico"], "operationId": "verificarVuelo", "security": [], "parameters": [{"name": "numero", "in": "path", "required": true, "schema": {"type": "string", "example": "AV10"}}, {"name": "fecha", "in": "path", "required": true, "schema": {"type": "string", "format": "date", "example": "2026-12-01"}}], "responses": {"200": {"description": "Datos del vuelo (sin confirmar).", "content": {"application/json": {"schema": {"type": "object", "additionalProperties": true}}}}, "500": {"description": "Falta la clave en el servidor.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "RAPIDAPI_KEY no está configurada en el servidor"}}}}}}}, "/api/encomiendas": {"post": {"tags": ["Encomiendas"], "summary": "⚠️ Publicar una encomienda (no valida el body) — 📦 Remitente", "description": "**Quién la usa:** 📦 Remitente. El remitente publica lo que quiere enviar.\n\nEl remitente publica. **El backend no valida**: `{}` crea una encomienda vacía con 201, así que la app valida\ntodo antes (ciudades de la lista, origen ≠ destino, valor entero > 0, descripción de 3 a 200 caracteres).\n`fechaVencimiento` se ignora: siempre vence un mes después de creada.\n", "x-roles": ["remitente"], "operationId": "crearEncomienda", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/EncomiendaEntrada"}, "example": {"ciudadOrigen": "Bogota", "ciudadDestino": "Miami", "observaciones": "Prueba Lapticon: libro pequeño", "moneda": "USD", "valor": 15}}}}, "responses": {"201": {"description": "Encomienda creada.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Encomienda"}, "example": {"_id": "6ada5d86a4012aeb7e63d853", "uid": "Cpmc8Mv0CkTD0aJJMtiOBEzDNV03", "ciudadOrigen": "Bogota", "ciudadDestino": "Miami", "observaciones": "Prueba Lapticon: libro pequeño", "moneda": "USD", "valor": 15, "estado": "disponible", "viajeroId": null, "fechaCreacion": "2026-10-22T19:01:26.915Z", "fechaVencimiento": "2026-11-22T19:01:26.915Z", "fechaDisponibleDesde": "2026-10-22T19:01:26.915Z", "fechaLimiteEntrega": null, "__v": 0}}}}, "401": {"$ref": "#/components/responses/NoAutenticado"}}}, "get": {"tags": ["Encomiendas"], "summary": "✅ Listar mis encomiendas — 📦 Remitente", "description": "**Quién la usa:** 📦 Remitente. El remitente ve lo que publicó. El viajero también la usa para no ofrecerse sus propias encomiendas.\n\nSolo las que yo publiqué, en cualquier estado. **No** incluye las que tomé como viajero (ver\n`GET /api/encomiendas/buscar`). No trae el nombre del viajero.\n", "x-roles": ["remitente"], "operationId": "listarMisEncomiendas", "responses": {"200": {"description": "Mis encomiendas.", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Encomienda"}}, "example": [{"_id": "6ada5d86a4012aeb7e63d853", "uid": "Cpmc8Mv0CkTD0aJJMtiOBEzDNV03", "ciudadOrigen": "Bogota", "ciudadDestino": "Miami", "observaciones": "Prueba Lapticon: libro pequeño", "moneda": "USD", "valor": 15, "estado": "disponible", "viajeroId": null, "fechaCreacion": "2026-10-22T19:01:26.915Z", "fechaVencimiento": "2026-11-22T19:01:26.915Z", "fechaDisponibleDesde": "2026-10-22T19:01:26.915Z", "fechaLimiteEntrega": null, "__v": 0}]}}}, "401": {"$ref": "#/components/responses/NoAutenticado"}}}}, "/api/encomiendas/disponibles": {"get": {"tags": ["Encomiendas"], "summary": "⚠️ Encomiendas disponible ero y viceversa (`rolDestino`).\n\n`usuarioOrigen` sale del token. **Ignora `encomiendaId`** y no comprueba que la encomienda esté entregada.\nBody vacío o calificación fuera de 1-5 → **500** (no 400), por eso la app limita antes de enviar.\n", "x-roles": ["remitente", "viajero"], "operationId": "crearCalificacion", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CalificacionEntrada"}, "example": {"usuarioDestino": "IeMGfjHQ7XTc0W08QrTzx1flvo13", "rolDestino": "viajero", "calificacion": 5, "comentario": "Excelente, muy puntual"}}}}, "responses": {"201": {"description": "Guardada.", "content": {"application/json": {"schema": {"type": "object", "properties": {"mensaje": {"type": "string"}, "data": {"$ref": "#/components/schemas/Calificacion"}}}, "example": {"mensaje": "Calificación guardada", "data": {"_id": "6ada5e83a4012aeb7e63d87f", "usuarioOrigen": "Cpmc8Mv0CkTD0aJJMtiOBEzDNV03", "usuarioDestino": "IeMGfjHQ7XTc0W08QrTzx1flvo13", "rolDestino": "viajero", "calificacion": 5, "comentario": "Prueba antes de entregar", "timestamp": "2026-10-22T19:05:39.400Z", "__v": 0}}}}}, "401": {"$ref": "#/components/responses/NoAutenticado"}, "500": {"description": "Body vacío o calificación fuera de rango (debería ser 400).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "Error interno al guardar calificación"}}}}}}}, "/api/ratings/{uid}": {"parameters": [{"$ref": "#/components/parameters/Uid"}], "get": {"tags": ["Calificaciones"], "summary": "✅ Calificaciones de un usuario — 🌐 Público", "description": "**Quién la usa:** 🌐 Público. Cualquiera: reputación de la contraparte antes de confiar en ella.\n", "x-roles": ["publico"], "operationId": "obtenerCalificaciones", "security": [], "responses": {"200": {"description": "Resumen y lista. `promedio` es `null` si no tiene calificaciones.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ResumenCalificaciones"}, "example": {"total": 1, "promedio": 5, "calificaciones": [{"_id": "6ada5e83a4012aeb7e63d87f", "usuarioOrigen": "Cpmc8Mv0CkTD0aJJMtiOBEzDNV03", "usuarioDestino": "IeMGfjHQ7XTc0W08QrTzx1flvo13", "rolDestino": "viajero", "calificacion": 5, "comentario": "Prueba antes de entregar", "timestamp": "2026-10-22T19:05:39.400Z", "__v": 0}]}}}}}}}, "/api/chats/estado/{chatId}": {"get": {"tags": ["Chats"], "summary": "✅ Estado de un chat — 📦 Remitente · ✈️ Viajero", "description": "**Quién la usa:** 📦 Remitente · ✈️ Viajero. Los dos, antes de escribir.\n\n`chatId` = los dos uid **ordenados** y unidos con `_`, así el mismo par abre siempre el mismo chat (en otro\norden da 404). El documento lo crea el backend: al **tomar** una encomienda queda `activo`; al marcarla\n**`entregada`** pasa a `cerrado` con `fechaCierre`; tomar otra del mismo par lo vuelve a abrir. La app trata\n`cerrado` como bloqueado y `activo`, 404 o 500 como abierto. Los mensajes van directo a Firestore:\n`chats/{chatId}/mensajes/{autoId}` con `{ texto, emisorUid, creadoEn }`. (Hasta el 22-oct respondía 500.)\n", "x-roles": ["remitente", "viajero"], "operationId": "estadoChat", "parameters": [{"name": "chatId", "in": "path", "required": true, "schema": {"type": "string", "example": "Cpmc8Mv0CkTD0aJJMtiOBEzDNV03_IeMGfjHQ7XTc0W08QrTzx1flvo13"}}], "responses": {"200": {"description": "Estado del chat del par.", "content": {"application/json": {"schema": {"type": "object", "properties": {"estado": {"type": "string", "enum": ["activo", "cerrado"]}, "fechaCierre": {"type": ["string", "null"], "format": "date-time"}}}, "examples": {"activo": {"summary": "Tras tomar una encomienda", "value": {"estado": "activo", "fechaCierre": null}}, "cerrado": {"summary": "Tras marcarla entregada", "value": {"estado": "cerrado", "fechaCierre": "2026-10-29T00:46:00.283Z"}}}}}}, "401": {"$ref": "#/components/responses/NoAutenticado"}, "403": {"$ref": "#/components/responses/NoAutorizado"}, "404": {"description": "El par nunca tuvo una encomienda tomada, o el id está en otro orden.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "Chat no encontrado"}}}}, "500": {"description": "Falla del servidor (así respondía el 22-oct).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "Error interno del servidor"}}}}}}}, "/api/ciudades/paises": {"get": {"tags": ["Ciudades"], "summary": "✅ Listar países — 🌐 Público", "description": "**Quién la usa:** 🌐 Público. Formulario de perfil (nacionalidad).\n\nArreglo plano en inglés, con algunos nombres mal codificados y duplicados.\n", "x-roles": ["publico"], "operationId": "listarPaises", "security": [], "responses": {"200": {"description": "Países.", "content": {"application/json": {"schema": {"type": "array", "items": {"type": "string"}}, "example": ["Afghanistan", "Albania", "Colombia", "United States"]}}}}}}, "/api/ciudades/ciudades": {"get": {"tags": ["Ciudades"], "summary": "✅ Listar ciudades — 🌐 Público", "description": "**Quién la usa:** 🌐 Público. Formularios de viaje y encomienda.\n\n~1.800–2.000 ciudades de América, sin tildes. La app las guarda 7 días en el dispositivo.\n", "x-roles": ["publico"], "operationId": "listarCiudades", "security": [], "responses": {"200": {"description": "Ciudades.", "content": {"application/json": {"schema": {"type": "array", "items": {"type": "string"}}, "example": ["Bogota", "Medellin", "Miami", "Madrid"]}}}}}}, "/api/ciudades/ciudades-por-pais": {"get": {"tags": ["Ciudades"], "summary": "✅ Ciudades de un país (con tildes) — 🌐 Público", "description": "**Quién la usa:** nadie todavía. Serviría para sugerir ciudades según la nacionalidad.\n\nLos nombres vienen **con tildes** (`Bogotá`), distintos de `/api/ciudades/ciudades` (`Bogota`). No mezclarla con\nlos formularios: los filtros del backend comparan el texto exacto.\n", "x-roles": ["publico"], "operationId": "ciudadesPorPais", "security": [], "para `PUT /api/users/{uid}` descarta `rol`, así que la app lo guarda en el dispositivo y al\nentrar desde otro celular hay que elegirlo otra vez. Alternativa equivalente: aceptar `rol` en el PUT actual.\n", "x-roles": ["remitente", "viajero"], "operationId": "guardarRol", "x-estado": "propuesto", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["rol"], "properties": {"rol": {"$ref": "#/components/schemas/Rol"}}}, "example": {"rol": "viajero"}}}}, "responses": {"200": {"description": "Rol guardado; el perfil lo incluye desde entonces.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RespuestaUsuario"}}}}, "400": {"description": "Rol inválido.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "Rol inválido. Debe ser uno de: remitente, viajero"}}}}, "403": {"$ref": "#/components/responses/NoAutorizado"}}}}, "/api/users/{uid}/publico": {"parameters": [{"$ref": "#/components/parameters/Uid"}], "get": {"tags": ["🆕 Faltan en el backend"], "summary": "🆕 Perfil público de otro usuario — 📦 Remitente · ✈️ Viajero", "description": "**Quién la usa:** 📦 Remitente · ✈️ Viajero. Remitente: ver al viajero que tomó su encomienda. Viajero: ver al remitente.\n\n**Por qué hace falta:** `GET /api/users/{uid}` da 403 para cualquier otro usuario. `GET /api/viajes/disponibles`\nda el nombre del viajero, pero solo mientras su viaje esté `disponible`; después, el remitente ya no puede ver\nquién llevó su encomienda.\nDevolvería solo datos no sensibles: nada de teléfono ni correo.\n", "x-roles": ["remitente", "viajero"], "operationId": "perfilPublico", "x-estado": "propuesto", "responses": {"200": {"description": "Datos públicos.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PerfilPublico"}, "example": {"uid": "IeMGfjHQ7XTc0W08QrTzx1flvo13", "nombre": "Harold", "apellido": "C.", "rol": "viajero", "promedio": 5, "totalCalificacio ies": {"token": {"type": "string"}, "plataforma": {"type": "string", "enum": ["android", "ios", "web"]}}}, "example": {"token": "fcm-token-del-dispositivo", "plataforma": "android"}}}}, "responses": {"204": {"description": "Guardado."}, "403": {"$ref": "#/components/responses/NoAutorizado"}}}}}, "components": {"securitySchemes": {"bearerAuth": {"type": "http", "scheme": "bearer", "bearerFormat": "JWT (idToken de Firebase)", "description": "Pega solo el `idToken` (sin la palabra Bearer). Se obtiene con el primer endpoint y dura 1 hora."}}, "parameters": {"Uid": {"name": "uid", "in": "path", "required": true, "description": "uid de Firebase.", "schema": {"type": "string", "example": "Cpmc8Mv0CkTD0aJJMtiOBEzDNV03"}}, "EncomiendaId": {"name": "id", "in": "path", "required": true, "description": "`_id` de MongoDB de la encomienda.", "schema": {"type": "string", "example": "6ada5d86a4012aeb7e63d853"}}}, "responses": {"NoAutenticado": {"description": "Sin token o token inválido/vencido.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "examples": {"sinToken": {"summary": "Sin encabezado", "value": {"error": "Token no proporcionado"}}, "invalido": {"summary": "Token inválido o vencido", "value": {"error": "Token inválido"}}}}}}, "NoAutorizado": {"description": "El recurso no es mío.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "NoEncontrado": {"description": "No existe.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}, "schemas": {"Error": {"type": "object", "required": ["error"], "properties": {"error": {"type": "string"}, "detalle": {"description": "Detalle técnico opcional."}}}, "Mensaje": {"type": "object", "properties": {"mensaje": {"type": "string"}}}, "Rol": {"type": "string", "enum": ["remitente", "viajero"]}, "UsuarioEntrada": {"type": "object", "required": ["nombre", "apellido", "telefono", "nacionalidad"], "properties": {"nombre": {"type": "string ": "string", "example": "Miami"}, "fechaViaje": {"type": "string", "format": "date", "example": "2026-12-01"}}}, "Viaje": {"type": "object", "properties": {"_id": {"type": "string"}, "uid": {"type": "string", "description": "uid del viajero"}, "numeroVuelo": {"type": "string"}, "ciudadOrigen": {"type": "string"}, "ciudadDestino": {"type": "string"}, "fechaViaje": {"type": "string", "format": "date-time", "description": "Medianoche UTC: leer como fecha de calendario."}, "estado": {"type": "string", "enum": ["disponible", "completado", "cancelado", "contactado"], "description": "Pasa a `completado` al consultar después de la fecha, o con `PATCH …/estado`. `contactado` solo aparece en el oficial."}, "createdAt": {"type": "string", "format": "date-time"}, "__v": {"type": "integer"}}}, "EstadoEncomienda": {"type": "string", "enum": ["disponible", "tomada", "vencida", "entregada", "recibida"], "description": "No existe `cancelada`. El oficial no lista `entregada`, pero el servidor la acepta."}, "EncomiendaEntrada": {"type": "object", "required": ["ciudadOrigen", "ciudadDestino", "observaciones", "moneda", "valor"], "description": "El backend no exige nada; estas reglas las aplica la app.", "properties": {"ciudadOrigen": {"type": "string", "example": "Bogota"}, "ciudadDestino": {"type": "string", "example": "Miami", "description": "Distinta del origen."}, "observaciones": {"type": "string", "minLength": 3, "maxLength": 200, "description": "Qué se envía."}, "moneda": {"type": "string", "enum": ["USD", "COP", "EUR"], "example": "USD"}, "valor": {"type": "integer", "minimum": 1, "description": "Lo que se le paga al viajero."}}}, "Encomienda": {"type": "object", "properties": {"_id": {"type": "string"}, "uid": {"type": "string", "description": "uid del remitente"}, "viajeroId": {"type": ["string", "null"], "description": "uid del viajero que la tomó"}, "ciudadOrigen": {"type": "string"}, "ciudadDestino": {"type": "string"}, "observaciones": {"type": "string"}, "moneda": {"type
