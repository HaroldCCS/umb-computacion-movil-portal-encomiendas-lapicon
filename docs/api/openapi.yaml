openapi: 3.1.0
info:
  title: Lapticon API
  version: "2026-10-26"
  description: |
    Contrato del backend compartido del curso (Node/Express + MongoDB en Render), reconstruido a partir de la colección
    de Postman del profesor y **verificado con peticiones reales** el 22-oct-2026 con dos cuentas propias (remitente y
    viajero). Las respuestas de ejemplo son reales (teléfono y correo ocultos) y están en `referencias/respuestas/`.

    **Cómo leer este documento**

    | Marca | Significado |
    |---|---|
    | ✅ | Existe y responde como se documenta |
    | ⚠️ | Existe, pero falla en el servidor o se comporta distinto a lo esperado |
    | 🆕 | **No existe**: la app lo necesita y hoy lo resuelve en el dispositivo. Es una propuesta para el backend |

    **Autenticación:** iniciar sesión con Firebase Auth (proyecto `lapticon-eba31`) y enviar el `idToken` en
    `Authorization: Bearer <idToken>`. Son públicas solo `GET /api/ratings/{uid}` y `/api/ciudades/*`.
    El backend toma el usuario del token (`req.user.uid`): **nunca** se manda el uid propio en el body.

    **Roles:** el backend **no tiene roles** (no guarda `rol` ni comprueba quién hace cada acción); el rol lo decide la
    app. Cada operación dice en el título quién la usa (📦 Remitente · ✈️ Viajero · 🌐 Público) y lo repite en
    `x-roles`.

    | Rol | Qué hace | Endpoints |
    |---|---|---|
    | 📦 Remitente | Publica encomiendas, busca viajeros, retira, confirma que la recibió y califica | `POST /api/encomiendas`, `GET /api/encomiendas`, `GET /api/viajes/buscar`, `PUT …/estado` (`vencida`, `recibida`), `POST /api/ratings` |
    | ✈️ Viajero | Registra su viaje, explora y toma encomiendas, la entrega y califica | `POST /api/viajes`, `GET /api/viajes`, `GET /api/viajes/disponible`, `GET /api/vuelos/…`, `GET /api/encomiendas/disponibles`, `PUT …/tomar/{id}`, `PUT …/estado` (`entregada`), `POST /api/ratings` |
    | Los dos | Perfil, chat, asistente | `/api/users/*`, `GET /api/chats/estado/{chatId}`, `POST /api/chatbot` |
    | 🌐 Público | Sin token | `GET /api/ratings/{uid}`, `/api/ciudades/*` |

    **Errores:** siempre `{ "error": "…" }` (a veces con `detalle`). Los éxitos usan `message` en usuarios y `mensaje`
    en el resto.

    **Arranque en frío:** Render gratuito duerme el servidor; la primera petición puede tardar hasta ~60 s.
  contact:
    name: Harold Camargo — Computación Móvil, UMB
# Ejemplos reales reutilizados (anclas YAML; `$ref` no sirve dentro de `example`).
